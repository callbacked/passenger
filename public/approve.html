<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Approve sign-in · Passenger</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f2f2f2; background: #0f0f0f; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
    main { width: min(440px, 100%); padding: 28px 24px; border: 1px solid #282828; border-radius: 16px; background: #151515; }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 19px; font-weight: 720; letter-spacing: -.6px; margin-bottom: 22px; }
    .brand svg { width: 26px; height: 26px; fill: #f5f5f5; fill-rule: evenodd; }
    h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -.6px; }
    p { margin: 0 0 12px; color: #c9c9c9; font-size: 15px; line-height: 1.6; }
    .note { color: #a0a0a0; font-size: 13px; }
    label { display: block; margin: 20px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #858585; }
    input { width: 100%; min-height: 56px; padding: 0 14px; border: 1px solid #3a3a3a; border-radius: 10px; background: #101010; color: #fff; font: 600 24px ui-monospace, monospace; letter-spacing: 3px; text-align: center; text-transform: uppercase; outline: none; }
    input:focus { border-color: #919191; box-shadow: 0 0 0 1px #919191; }
    .code-display { display: block; margin: 14px 0 4px; padding: 14px 10px; border: 1px solid #3a3a3a; border-radius: 10px; background: #101010; text-align: center; font: 600 26px ui-monospace, monospace; letter-spacing: 3px; }
    .button { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 52px; margin-top: 14px; border: 1px solid #e8e8e8; border-radius: 10px; background: #e8e8e8; color: #171717; font: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; }
    .button.secondary { background: transparent; color: #e8e8e8; border-color: #494949; }
    .button.quiet { min-height: 44px; margin-top: 8px; border: 0; background: none; color: #a0a0a0; font-size: 13px; text-decoration: underline; }
    .button:disabled { opacity: .5; }
    .button svg { width: 20px; height: 20px; }
    .who { font-family: ui-monospace, monospace; color: #fff; overflow-wrap: anywhere; }
    .message { min-height: 20px; color: #e0a5a5; font-size: 13px; margin-top: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M5 5h8a9 9 0 0 1 0 18H5V5Zm7 5v8l6-4-6-4Z"/></svg><span>Passenger</span></div>
    <section id="loading"><p class="note">Checking your sign-in…</p></section>
    <section id="signin" hidden>
      <h1>Approve a screen</h1>
      <p>Sign in with Google on this phone. The screen you scanned will sign in on its own.</p>
      <form id="form">
        <label for="code">CODE FROM THE SCREEN</label>
        <input id="code" name="code" inputmode="latin" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="7" placeholder="ABC-DEF" required>
        <button class="button" id="continue" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4Z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.4 14a6 6 0 0 1 0-3.9V7.5H3.1a10 10 0 0 0 0 9l3.3-2.6Z"/><path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.5L6.4 10c.8-2.3 3-4 5.6-4Z"/></svg>Continue with Google</button>
      </form>
    </section>
    <section id="confirm" hidden>
      <h1>Approve that screen?</h1>
      <p>Signed in as <span class="who" id="who"></span>. Only approve a code you can see on your own screen.</p>
      <strong class="code-display" id="code-display"></strong>
      <button class="button" id="approve" type="button">Approve this screen</button>
      <button class="button secondary" id="deny" type="button">Deny</button>
      <button class="button quiet" id="switch" type="button">Use a different Google account</button>
    </section>
    <section id="result" hidden>
      <h1 id="result-title"></h1>
      <p id="result-copy"></p>
      <a class="button" id="result-open" href="/" hidden>Open Passenger on this phone</a>
    </section>
    <p class="message" id="message" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="/approve.js"></script>
</body>
</html>
